
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Quiz App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            heading: ['Space Grotesk', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1', // Indigo 500
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          },
          keyframes: {
            'fade-in-up': {
              '0%': {
                opacity: '0',
                transform: 'translateY(20px)'
              },
              '100%': {
                opacity: '1',
                transform: 'translateY(0)'
              },
            },
            'fade-in-down': {
              '0%': {
                opacity: '0',
                transform: 'translateY(-20px)'
              },
              '100%': {
                opacity: '1',
                transform: 'translateY(0)'
              },
            },
            'fade-in': {
              '0%': {
                opacity: '0'
              },
              '100%': {
                opacity: '1'
              },
            },
            'scale-in': {
              '0%': {
                opacity: '0',
                transform: 'scale(0.95)'
              },
              '100%': {
                opacity: '1',
                transform: 'scale(1)'
              },
            },
            'background-pan': {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' },
            },
            'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
            }
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
            'fade-in-down': 'fade-in-down 0.5s ease-out forwards',
            'fade-in': 'fade-in 0.4s ease-out forwards',
            'scale-in': 'scale-in 0.3s ease-out forwards',
            'background-pan': 'background-pan 15s ease infinite',
            'float': 'float 6s ease-in-out infinite',
          }
        }
      }
    }
  </script>
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script>
    // These will be replaced by the server in production or can be set here for dev
    window.GEMINI_API_KEY = window.GEMINI_API_KEY || '';
    window.SUPABASE_URL = window.SUPABASE_URL || '';
    window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
    
    // Global constants for compatibility with TypeScript declarations
    var GEMINI_API_KEY = window.GEMINI_API_KEY;
    var SUPABASE_URL = window.SUPABASE_URL;
    var SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@7.8.1",
    "rxjs/operators": "https://esm.sh/rxjs@7.8.1/operators",
    "rxjs/ajax": "https://esm.sh/rxjs@7.8.1/ajax",
    "rxjs/webSocket": "https://esm.sh/rxjs@7.8.1/webSocket",
    "rxjs/testing": "https://esm.sh/rxjs@7.8.1/testing",
    "rxjs/fetch": "https://esm.sh/rxjs@7.8.1/fetch",
    "@angular/compiler": "https://esm.sh/@angular/compiler@20?external=rxjs",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@20?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@20?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@20?external=rxjs",
    "@angular/forms": "https://esm.sh/@angular/forms@20?external=rxjs",
    "@google/genai": "https://esm.sh/@google/genai@1.2.0",
    "chart.js/auto": "https://esm.sh/chart.js@4.4.3/auto",
    "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.4.168",
    "pdfjs-dist/build/pdf.worker.mjs": "https://esm.sh/pdfjs-dist@4.4.168/build/pdf.worker.mjs",
    "chart.js/": "https://esm.sh/chart.js@^4.5.1/",
    "quill": "https://esm.sh/quill@1.3.7",
    "ngx-quill": "https://esm.sh/ngx-quill@26.0.0?external=@angular/core,@angular/common,@angular/forms,rxjs"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <app-root></app-root>
  <script>
    const script = document.createElement('script');
    script.type = 'module';
    script.src = `index.tsx?v=${new Date().getTime()}`;
    document.body.appendChild(script);
  </script>
</body>
</html>
